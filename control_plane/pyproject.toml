[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-apply-control-plane"
version = "1.0.0"
description = "Redacted, signed control plane for the private Job Apply Agent runner"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.18.5",
    "cryptography==50.0.0",
    "fastapi==0.139.2",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff>=0.12,<1",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.setuptools.packages.find]
include = ["job_control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
