name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: job_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobagent:jobagent@localhost:5432/job_agent_test
      REDIS_URL: redis://localhost:6379/0
      TASKS_ALWAYS_EAGER: "true"
      LLM_PROVIDER: mock
      SECRET_KEY: ci-only-secret
      APP_ENV: test
      USER_PROFILE_PATH: user_profile.yaml.example
      CV_ROUTING_PATH: cv_routing.yaml.example
      CV_DIRECTORY: tests/fixtures/no-personal-cvs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,pdf,postgres,email]" pip-audit
      - name: Critical lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Full lint and format for touched Python modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only --diff-filter=ACM "$BASE_SHA" "$GITHUB_SHA" -- '*.py' > /tmp/changed-python.txt
          if [ -s /tmp/changed-python.txt ]; then
            xargs ruff check < /tmp/changed-python.txt
            xargs ruff format --check < /tmp/changed-python.txt
          fi
      - name: Full lint for v3 operational modules
        run: >
          ruff check
          core/config.py core/operations.py core/metrics.py
          api/main.py api/routes/dashboard.py api/routes/cv_routing.py
          api/routes/applications.py worker/health.py worker/celery_app.py
          worker/tasks.py profile/cv_routing.py profile/routing_evaluation.py
          profile/models.py submitters/form_brain.py llm/generation.py
          scripts/evaluate_cv_routing.py tests/test_operations.py
          scripts/linkedin_dry_run_smoke.py submitters/browser_trace.py
          submitters/linkedin_v2.py tests/test_cv_routing.py
          tests/test_linkedin_smoke.py
      - name: Typed safety-critical modules
        run: >
          mypy --ignore-missing-imports --disable-error-code var-annotated
          core/config.py core/portal_sessions.py core/application_audit.py
          core/submission_domain.py core/submission_state.py
          profile/cv_intake.py profile/writer.py worker/celery_app.py
          worker/submission_attempts.py submitters/platforms.py
          submitters/base.py
          submitters/employer_workflows.py submitters/confirmation.py
          submitters/workday.py
      - name: Typed v4 submission orchestration
        run: >
          mypy --ignore-missing-imports
          --disable-error-code var-annotated
          --disable-error-code assignment
          --disable-error-code arg-type
          --disable-error-code misc
          --disable-error-code union-attr
          --disable-error-code return-value
          core/submission_service.py core/submit_permits.py
          core/application_mutations.py core/application_revision.py
          worker/submission_commands.py api/routes/ats.py
      - name: PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic downgrade 003_v2_tables
          alembic upgrade head
      - name: Tests
        run: pytest -q --cov=api --cov=core --cov=profile --cov=worker --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit . --timeout 60
      - name: Compose validation
        run: cp .env.example .env && docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target web-api -t job-agent-api:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure safe dry-run environment
        run: |
          cp .env.example .env
          mkdir -p profile-data
      - name: Start operational stack
        run: docker compose up -d --build postgres redis web-api celery-worker celery-beat
      - name: Require API and worker readiness
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs web-api celery-worker celery-beat
          exit 1
      - name: Stop operational stack
        if: always()
        run: docker compose down --volumes
