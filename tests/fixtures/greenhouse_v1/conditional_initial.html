<!doctype html>
<html lang="en" data-greenhouse-variant="hosted">
  <body>
    <form id="application_form" data-greenhouse-application>
      <div data-gh-field data-field-id="resume" data-canonical-name="resume" data-required="true">
        <label>Resume</label>
        <input name="resume" type="file" required accept=".pdf">
      </div>
      <div data-gh-field data-field-id="question_relocation" data-required="true">
        <label>Are you willing to relocate?</label>
        <select name="question_relocation" required>
          <option value="">Choose</option>
          <option data-option-id="yes" value="yes">Yes</option>
          <option data-option-id="no" value="no">No</option>
        </select>
      </div>
      <button id="submit_app" type="submit">Submit application</button>
    </form>
  </body>
</html>
