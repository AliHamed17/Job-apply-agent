<!doctype html>
<html lang="en" data-greenhouse-variant="embedded">
  <body data-greenhouse-embedded>
    <form data-qa="application-form">
      <div data-qa="application-field" data-field-id="first_name"
           data-canonical-name="first_name" aria-required="true">
        <label>First name</label>
        <input name="first_name" type="text" required>
      </div>
      <div data-qa="application-field" data-field-id="resume"
           data-canonical-name="resume" aria-required="true">
        <label>Resume</label>
        <input name="resume" type="file" required accept="application/pdf">
      </div>
      <div data-qa="application-field" data-field-id="question_note">
        <label>Additional information</label>
        <textarea name="question_note" maxlength="500"></textarea>
      </div>
      <button data-qa="submit-application" type="submit">Submit application</button>
    </form>
  </body>
</html>
