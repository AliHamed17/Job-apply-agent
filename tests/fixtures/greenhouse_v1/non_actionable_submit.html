<!doctype html>
<html lang="en" data-greenhouse-variant="hosted">
  <body>
    <section inert>
      <form id="application_form" data-greenhouse-application method="post"
            action="/fixture/jobs/123456" enctype="multipart/form-data" target="_self">
        <div data-gh-field data-field-id="resume" data-canonical-name="resume"
             data-required="true">
          <label>Resume</label>
          <input name="resume" type="file" required accept=".pdf">
        </div>
        <button id="submit_app" type="submit" name="commit"
                value="submit_application">Submit application</button>
      </form>
    </section>
  </body>
</html>
