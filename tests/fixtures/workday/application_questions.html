<!doctype html>
<html lang="en">
  <body>
    <main>
      <h1>Application Questions</h1>
      <fieldset aria-required="true">
        <legend>Are you authorized to work in this country?</legend>
        <label for="authorized-yes">Yes</label>
        <input id="authorized-yes" name="authorized" type="radio" required>
        <label for="authorized-no">No</label>
        <input id="authorized-no" name="authorized" type="radio" required>
      </fieldset>
      <div data-automation-id="formField">
        <label>How Did You Hear About Us?</label>
        <button aria-label="How Did You Hear About Us?">Select one</button>
      </div>
      <button data-automation-id="bottom-navigation-next-button">
        Save and Continue
      </button>
    </main>
  </body>
</html>
