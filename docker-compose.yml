name: job-apply-agent

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  agent-net:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

# Optional build-only trust material. The managed Windows runtime replaces the
# public marker file with a pinned CA bundle mounted only as a BuildKit secret.
secrets:
  job-agent-enterprise-ca:
    file: ${JOB_AGENT_ENTERPRISE_CA_FILE:-./config/empty-enterprise-ca.txt}

# ── Services ───────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-job_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web API ───────────────────────────────────────────
  web-api:
    build:
      context: .
      target: web-api
      secrets:
        - source: job-agent-enterprise-ca
          target: enterprise_ca
    restart: unless-stopped
    env_file: ${JOB_AGENT_ENV_FILE:-.env}
    environment:
      # The host path selects this env_file for Compose interpolation. It is
      # not a valid path inside Linux containers; all values are already
      # injected, so clear only the selector before Python loads settings.
      JOB_AGENT_ENV_FILE: ""
      APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-job_agent}
      REDIS_URL: redis://redis:6379/0
      # Relocate the profile YAML into the shared ./profile-data volume below
      # so the resume PDF the upload endpoint writes next to it (same
      # yaml_path.parent — see api/routes/profile.py) is visible to
      # celery-worker too, not just this container's own filesystem layer.
      USER_PROFILE_PATH: /app/profile-data/user_profile.yaml
      APPLICATION_DATA_DIR: /app/profile-data
      CV_ROUTING_PATH: /app/profile-data/cv_routing.yaml
      CV_DIRECTORY: /app/profile-data/cvs
      EMPLOYER_CATALOG_PATH: /app/profile-data/employer_catalog.yaml
      GMAIL_OAUTH_TOKEN_PATH: /app/profile-data/.gmail_oauth.json
      EMPLOYER_WORKFLOW_PATH: /app/profile-data/employer_workflows.yaml
      LINKEDIN_BROWSER_PROFILE_DIR: /app/browser-state/linkedin
      PORTAL_BROWSER_PROFILE_ROOT: /app/browser-state/portals
      # Ollama remains on the private host. The runtime accepts only loopback
      # and this explicit Docker host gateway, and cloud model tags are rejected.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_EXPECTED_MODEL_DIGEST: ${OLLAMA_EXPECTED_MODEL_DIGEST:-sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      # The WhatsApp bridge (bridge/whatsapp_bridge.js) runs on the HOST — it
      # holds a personal WhatsApp Web session and is intentionally NOT
      # containerised. From inside this container, "localhost" is the container,
      # not the host, so the default localhost bridge URL is unreachable here.
      # Point at the host gateway instead (see extra_hosts below). NOTE: this
      # only works if you start the bridge listening on a host interface the
      # container can reach (e.g. HOST=0.0.0.0) rather than its default
      # 127.0.0.1-only bind — that trade-off is yours to make when enabling
      # WhatsApp outbound. Leave WhatsApp outbound disabled and this is a no-op.
      BRIDGE_SEND_URL: http://host.docker.internal:8100/send
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net
    volumes:
      # Writable: the resume-upload endpoint (api/routes/profile.py) rewrites
      # user_profile.yaml here on every CV upload and saves resume.pdf
      # alongside it. Read-only here would make uploads fail instead of
      # updating the profile and rescoring jobs.
      - ${JOB_AGENT_PROFILE_DATA_DIR:-./profile-data}:/app/profile-data
      - ${JOB_AGENT_BROWSER_STATE_DIR:-./.browser-state}:/app/browser-state
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────
  celery-worker:
    build:
      context: .
      target: celery-worker
      secrets:
        - source: job-agent-enterprise-ca
          target: enterprise_ca
    restart: unless-stopped
    env_file: ${JOB_AGENT_ENV_FILE:-.env}
    environment:
      JOB_AGENT_ENV_FILE: ""
      APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-job_agent}
      REDIS_URL: redis://redis:6379/0
      USER_PROFILE_PATH: /app/profile-data/user_profile.yaml
      APPLICATION_DATA_DIR: /app/profile-data
      CV_ROUTING_PATH: /app/profile-data/cv_routing.yaml
      CV_DIRECTORY: /app/profile-data/cvs
      EMPLOYER_CATALOG_PATH: /app/profile-data/employer_catalog.yaml
      GMAIL_OAUTH_TOKEN_PATH: /app/profile-data/.gmail_oauth.json
      EMPLOYER_WORKFLOW_PATH: /app/profile-data/employer_workflows.yaml
      LINKEDIN_BROWSER_PROFILE_DIR: /app/browser-state/linkedin
      PORTAL_BROWSER_PROFILE_ROOT: /app/browser-state/portals
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_EXPECTED_MODEL_DIGEST: ${OLLAMA_EXPECTED_MODEL_DIGEST:-sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
    command: ["celery", "-A", "worker.celery_app", "worker", "-Q", "ingestion,processing,llm,submission,discovery", "--loglevel=info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net
    volumes:
      # Read-only: this container never writes the profile/resume, only
      # web-api's upload endpoint does.
      - ${JOB_AGENT_PROFILE_DATA_DIR:-./profile-data}:/app/profile-data:ro
      # Read-write: the one-time `python -m discovery.login` session (run on
      # the host, saved under LINKEDIN_BROWSER_PROFILE_DIR) must be visible
      # here, since this is the container that actually launches Chromium
      # for LinkedIn discovery/Easy Apply and needs to keep writing to it
      # (cookie refresh etc.) — without this mount every run opens a fresh,
      # logged-out browser.
      - ${JOB_AGENT_BROWSER_STATE_DIR:-./.browser-state}:/app/browser-state
    # Scale workers: docker-compose up --scale celery-worker=3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Celery Beat (scheduled tasks) ─────────────────────
  celery-beat:
    build:
      context: .
      target: celery-worker
      secrets:
        - source: job-agent-enterprise-ca
          target: enterprise_ca
    restart: unless-stopped
    env_file: ${JOB_AGENT_ENV_FILE:-.env}
    environment:
      JOB_AGENT_ENV_FILE: ""
      APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-job_agent}
      REDIS_URL: redis://redis:6379/0
      USER_PROFILE_PATH: /app/profile-data/user_profile.yaml
      APPLICATION_DATA_DIR: /app/profile-data
      CV_ROUTING_PATH: /app/profile-data/cv_routing.yaml
      CV_DIRECTORY: /app/profile-data/cvs
      EMPLOYER_CATALOG_PATH: /app/profile-data/employer_catalog.yaml
      GMAIL_OAUTH_TOKEN_PATH: /app/profile-data/.gmail_oauth.json
      EMPLOYER_WORKFLOW_PATH: /app/profile-data/employer_workflows.yaml
      LINKEDIN_BROWSER_PROFILE_DIR: /app/browser-state/linkedin
      PORTAL_BROWSER_PROFILE_ROOT: /app/browser-state/portals
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      - redis
    networks:
      - agent-net
    volumes:
      # Read-only: beat only schedules tasks, it never runs them itself, so
      # it never writes the profile or drives a browser — but it's mounted
      # here too for parity with celery-worker.
      - ${JOB_AGENT_PROFILE_DATA_DIR:-./profile-data}:/app/profile-data:ro
      - ${JOB_AGENT_BROWSER_STATE_DIR:-./.browser-state}:/app/browser-state:ro

  # ── Nginx Reverse Proxy ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${JOB_AGENT_TLS_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    depends_on:
      - web-api
    networks:
      - agent-net

  # ── Prometheus ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - agent-net

  # ── Grafana ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - agent-net
