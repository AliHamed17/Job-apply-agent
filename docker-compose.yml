version: "3.9"

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  agent-net:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

# ── Services ───────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-job_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web API ───────────────────────────────────────────
  web-api:
    build:
      context: .
      target: web-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-job_agent}
      REDIS_URL: redis://redis:6379/0
      # Relocate the profile YAML into the shared ./profile-data volume below
      # so the resume PDF the upload endpoint writes next to it (same
      # yaml_path.parent — see api/routes/profile.py) is visible to
      # celery-worker too, not just this container's own filesystem layer.
      USER_PROFILE_PATH: /app/profile-data/user_profile.yaml
      APPLICATION_DATA_DIR: /app/profile-data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net
    volumes:
      # Writable: the resume-upload endpoint (api/routes/profile.py) rewrites
      # user_profile.yaml here on every CV upload and saves resume.pdf
      # alongside it. Read-only here would make uploads fail instead of
      # updating the profile and rescoring jobs.
      - ./profile-data:/app/profile-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────
  celery-worker:
    build:
      context: .
      target: celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-job_agent}
      REDIS_URL: redis://redis:6379/0
      USER_PROFILE_PATH: /app/profile-data/user_profile.yaml
      APPLICATION_DATA_DIR: /app/profile-data
    command: ["celery", "-A", "worker.celery_app", "worker", "-Q", "ingestion,processing,llm,submission,discovery", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net
    volumes:
      # Read-only: this container never writes the profile/resume, only
      # web-api's upload endpoint does.
      - ./profile-data:/app/profile-data:ro
      # Read-write: the one-time `python -m discovery.login` session (run on
      # the host, saved under LINKEDIN_BROWSER_PROFILE_DIR) must be visible
      # here, since this is the container that actually launches Chromium
      # for LinkedIn discovery/Easy Apply and needs to keep writing to it
      # (cookie refresh etc.) — without this mount every run opens a fresh,
      # logged-out browser.
      - ./.linkedin_profile:/app/.linkedin_profile
    # Scale workers: docker-compose up --scale celery-worker=3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Celery Beat (scheduled tasks) ─────────────────────
  celery-beat:
    build:
      context: .
      target: celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-job_agent}
      REDIS_URL: redis://redis:6379/0
      USER_PROFILE_PATH: /app/profile-data/user_profile.yaml
      APPLICATION_DATA_DIR: /app/profile-data
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      - redis
    networks:
      - agent-net
    volumes:
      # Read-only: beat only schedules tasks, it never runs them itself, so
      # it never writes the profile or drives a browser — but it's mounted
      # here too for parity with celery-worker.
      - ./profile-data:/app/profile-data:ro
      - ./.linkedin_profile:/app/.linkedin_profile:ro

  # ── Nginx Reverse Proxy ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro         # mount your TLS certs here
    depends_on:
      - web-api
    networks:
      - agent-net

  # ── Prometheus ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - agent-net

  # ── Grafana ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - agent-net
